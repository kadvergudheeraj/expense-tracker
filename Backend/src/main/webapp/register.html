<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Create an Expense Tracker account.">
	<title>Register | Expense Tracker</title>
	<link rel="stylesheet" href="css/style.css">
	<script src="script/script.js" defer></script>
</head>
<body>
	<main class="auth-page">
		<section class="auth-card" aria-labelledby="register-title">
			<a class="brand auth-brand" href="dashboard.html" aria-label="Expense Tracker home">
				<span class="brand-mark" aria-hidden="true">E</span>
				<span>Expense<span class="brand-light">Tracker</span></span>
			</a>

			<div class="auth-heading">
				<p class="eyebrow">GET STARTED</p>
				<h1 id="register-title">Create your account</h1>
				<p>One place to keep track of your spending.</p>
			</div>

			<form class="auth-form" action="/expense-tracker/register" method="post">
				<div class="form-field">
					<label for="full-name">Full name</label>
					<input id="full-name" name="full-name" type="text" autocomplete="name" placeholder="Your name" required>
				</div>

				<div class="form-field">
					<label for="email">Email address</label>
					<input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
				</div>

				<div class="form-field">
					<label for="password">Password</label>
					<input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
				</div>

				<div class="form-field">
					<label for="confirm-password">Confirm password</label>
					<input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" placeholder="Enter your password again" required>
				</div>

				<button class="form-button form-button-primary auth-submit" type="submit">Register</button>
			</form>

			<p class="auth-register"><a href="login.html">Already have an account? Login</a></p>
		</section>
	</main>
</body>
</html>
