<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Log in to Expense Tracker.">
	<title>Login | Expense Tracker</title>
	<link rel="stylesheet" href="css/style.css">
	<script src="script/script.js" defer></script>
</head>
<body>
	<main class="auth-page">
		<section class="auth-card" aria-labelledby="login-title">
			<a class="brand auth-brand" href="dashboard.html" aria-label="Expense Tracker home">
				<span class="brand-mark" aria-hidden="true">E</span>
				<span>Expense<span class="brand-light">Tracker</span></span>
			</a>

			<div class="auth-heading">
				<p class="eyebrow">WELCOME BACK</p>
				<h1 id="login-title">Log in to your account</h1>
				<p>Keep your spending in view.</p>
			</div>

			<form class="auth-form" method="post">
				<div class="form-field">
					<label for="email">Email address</label>
					<input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required>
				</div>

				<div class="form-field">
					<label for="password">Password</label>
					<input id="password" name="password" type="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters" required>
				</div>

				<label class="remember-row" for="remember-me">
					<input id="remember-me" name="remember-me" type="checkbox">
					Remember me
				</label>

				<button class="form-button form-button-primary auth-submit" type="submit">Login</button>
			</form>

			<p class="auth-register"><a href="register.html">Don't have an account? Register</a></p>
		</section>
	</main>
</body>
</html>
